<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARTECH - Создание и поддержка сайтов</title>
</head>
<body>
  <div class="preloader">
    <div class="preloader__container">
      <svg class="preloader__svg" width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="80" stroke="#fff" stroke-width="2" fill="none" class="preloader__text">KARTECH</text>
        <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="80" stroke="url(#rainbow)" stroke-width="4" fill="none" class="preloader__stroke">
          KARTECH
        </text>
        <defs>
          <linearGradient id="rainbow" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff0000" />
            <stop offset="0.2" stop-color="#ff9900" />
            <stop offset="0.4" stop-color="#ffff00" />
            <stop offset="0.6" stop-color="#00ff00" />
            <stop offset="0.8" stop-color="#0000ff" />
            <stop offset="1" stop-color="#9900ff" />
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

</body>
</html>
